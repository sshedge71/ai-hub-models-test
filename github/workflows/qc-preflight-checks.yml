name: QC Preflight Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    name: Run QC Preflight Checks
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@test_copyright_license_action
    with:
      enable-semgrep-scan: true
      enable-dependency-review: false
      enable-repolinter-check: true
      enable-copyright-license-check: true
      enable-commit-email-check: false
      enable-commit-msg-check: false
      enable-armor-checkers: false
      enable-full-repo-scan: true
      # full-repo-scan-fail-on-findings defaults to 'true' (enforcing) in the orchestrator.
    permissions:
      contents: read
      security-events: write
